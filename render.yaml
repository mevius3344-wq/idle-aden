databases:
  - name: idle-aden-db
    plan: free
    region: singapore

services:
  - type: web
    name: idle-aden
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: idle-aden-db
          property: connectionString
