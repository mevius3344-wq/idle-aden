# push 到 main → 自動部署 Railway + Vercel
name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Railway + Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Railway (GitHub trigger / token / hook)
        env:
          HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +e
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" && echo "Railway deploy hook triggered." && exit 0
            echo "::warning::RAILWAY_DEPLOY_HOOK 呼叫失敗"
          fi
          if [ -n "$RAILWAY_TOKEN" ]; then
            npm i -g @railway/cli
            if railway redeploy --service game --project 4f011df0-515e-4142-90bb-df1a2cf5e28c --environment production --from-source -y; then
              echo "Railway redeploy --from-source triggered."
              exit 0
            fi
            echo "::warning::RAILWAY_TOKEN 無效或無權限。請到 Railway → Account → Tokens 建 Project Token，更新 GitHub Secret RAILWAY_TOKEN。"
            exit 0
          fi
          echo "無 RAILWAY_DEPLOY_HOOK／RAILWAY_TOKEN；請確認 Railway 已連 GitHub 或手動部署。"
          exit 0

      - name: Deploy Vercel (Deploy Hook)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK 未設定，略過（Vercel Git 整合仍可自動部署）。"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Vercel deploy hook triggered."

      - name: Verify game host version
        env:
          GAME_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
        run: |
          URL="${GAME_URL:-https://game-production-b224.up.railway.app}"
          echo "等待遊戲主機啟動（60 秒）... $URL"
          sleep 60
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -fsS "${URL}/api/version?t=$RANDOM" 2>/dev/null || echo "{}")
            echo "檢查 $i: $BODY"
            echo "$BODY" | grep -q '"gameVersion"' && echo "✅ 線上已更新" && exit 0
            sleep 25
          done
          echo "::warning::尚未偵測到 gameVersion，可能仍在部署中或網址未對。"
