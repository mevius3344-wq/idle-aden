# push 到 main → 自動部署 Render + Vercel
# 首次設定：雙擊專案根目錄「幫我設定自動部署.bat」
name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Render + Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Render (Deploy Hook)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK 未設定，嘗試 API 方式..."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Render deploy hook triggered."

      - name: Deploy Render (API)
        env:
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$SERVICE_ID" ]; then
            echo "RENDER_API_KEY / RENDER_SERVICE_ID 未設定，略過 API 部署。"
            exit 0
          fi
          curl -fsS -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "Render API deploy triggered."

      - name: Deploy Vercel (Deploy Hook)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK 未設定，略過。"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Vercel deploy hook triggered."

      - name: Verify Render version
        run: |
          echo "等待 Render 啟動（90 秒）..."
          sleep 90
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -fsS "https://idle-aden.onrender.com/api/version?t=$RANDOM" 2>/dev/null || echo "{}")
            echo "檢查 $i: $BODY"
            echo "$BODY" | grep -q '"gameVersion"' && echo "✅ 線上已更新" && exit 0
            sleep 30
          done
          echo "::warning::尚未偵測到 gameVersion，可能仍在部署中。"
