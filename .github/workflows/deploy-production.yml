# push 到 main → 自動部署 Railway + Vercel
name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Railway + Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Railway (Deploy Hook)
        env:
          HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RAILWAY_DEPLOY_HOOK 未設定，略過（請在 Railway → Settings → Deploy → Deploy Hooks 建立後加到 GitHub Secrets）。"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Railway deploy hook triggered."

      - name: Deploy Vercel (Deploy Hook)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK 未設定，略過。"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Vercel deploy hook triggered."

      - name: Verify game host version
        env:
          GAME_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
        run: |
          URL="${GAME_URL:-https://idle-aden-production.up.railway.app}"
          echo "等待遊戲主機啟動（60 秒）... $URL"
          sleep 60
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -fsS "${URL}/api/version?t=$RANDOM" 2>/dev/null || echo "{}")
            echo "檢查 $i: $BODY"
            echo "$BODY" | grep -q '"gameVersion"' && echo "✅ 線上已更新" && exit 0
            sleep 25
          done
          echo "::warning::尚未偵測到 gameVersion，可能仍在部署中或網址未對。"
