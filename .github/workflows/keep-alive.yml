# Railway 遊戲主機保活（通常不休眠；仍定期 ping 以便監控）
name: Keep Game Host Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Railway /api/version
    runs-on: ubuntu-latest
    steps:
      - name: Wake game service
        env:
          GAME_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
        run: |
          URL="${GAME_URL:-https://idle-aden-production.up.railway.app}"
          for i in 1 2 3; do
            if curl -fsS --max-time 45 "${URL}/api/version?wake=$(date +%s)" >/tmp/ver.json; then
              echo "OK ${URL}"
              cat /tmp/ver.json
              exit 0
            fi
            echo "retry $i..."
            sleep 8
          done
          echo "::warning::Game host ping failed after 3 attempts."
